<!doctype html>
<html lang="id" class="h-full" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ekskul Etam — Ekstrakurikuler Terpadu Absensi Murid</title>

<!-- Library eksternal -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Style lokal (tema + komponen) -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= LOGIN / REGISTER ================= -->
<div id="login-screen">
  <div class="login-card animate-fade-in">
    <div class="text-center mb-6">
      <div class="logo-row">
        <img src="https://iili.io/nHvZkQt.md.png" alt="Logo SMP" class="logo-img" onerror="this.style.display='none'">
        <img src="https://iili.io/nYaQluR.md.png" alt="Logo ETAM" class="logo-img" onerror="this.style.display='none'">
      </div>
      <h1 class="brand-etam brand-title">EKSKUL ETAM</h1>
      <p class="brand-subtitle">Ekstrakurikuler Terpadu Absensi Murid</p>
      <p class="brand-slogan">"Presensi Terpadu, Aktivitas Ekskul Terpadu"</p>
      <p class="brand-school">UPT SMP Negeri 10 Samarinda</p>
    </div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-login" onclick="switchAuth('login')">Masuk</button>
      <button type="button" class="auth-tab" id="tab-register" onclick="switchAuth('register')">Daftar</button>
    </div>

    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="field-group">
        <label class="field-label" for="login-email">Email</label>
        <input type="email" id="login-email" class="field-input" placeholder="nama@email.com" autocomplete="username" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="field-input" placeholder="Password" autocomplete="current-password" required>
      </div>
      <div id="login-error" class="alert alert-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      <p class="demo-hint">Demo: <b>admin@etam.id</b> / <b>admin123</b></p>
    </form>

    <form id="form-register" class="hidden" onsubmit="handleRegister(event)">
      <div class="field-group">
        <label class="field-label" for="reg-name">Nama Lengkap</label>
        <input type="text" id="reg-name" class="field-input" placeholder="Nama lengkap" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="reg-email">Email</label>
        <input type="email" id="reg-email" class="field-input" placeholder="nama@email.com" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="reg-wa">No. WhatsApp</label>
        <input type="tel" id="reg-wa" class="field-input" placeholder="08xx" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="reg-role">Daftar Sebagai</label>
        <select id="reg-role" class="field-input" onchange="onRegRoleChange()" required>
          <option value="murid">Murid</option>
          <option value="guru">Guru Pembina</option>
          <option value="pelatih">Pelatih</option>
        </select>
      </div>
      <div class="field-group" id="reg-kelas-wrap">
        <label class="field-label" for="reg-kelas">Kelas</label>
        <select id="reg-kelas" class="field-input">
          <option value="">Pilih</option>
          <option>7A</option><option>7B</option><option>7C</option><option>7D</option><option>7E</option>
          <option>7F</option><option>7G</option><option>7H</option><option>7I</option><option>7J</option>
          <option>8A</option><option>8B</option><option>9A</option><option>9B</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label" for="reg-password">Password</label>
        <input type="password" id="reg-password" class="field-input" placeholder="Min 6 karakter" required minlength="6">
      </div>
      <div id="reg-error" class="alert alert-error hidden"></div>
      <div id="reg-info" class="alert alert-info hidden"></div>
      <button type="submit" class="btn btn-primary btn-block">Daftar</button>
    </form>

    <div class="login-footer">
      <span class="login-footer-label">Tema tampilan</span>
      <button type="button" class="theme-toggle-btn" onclick="cycleTheme()">
        <svg id="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
        </svg>
        <span id="theme-label">Otomatis</span>
      </button>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden min-h-full w-full">

  <header class="app-header">
    <div class="header-inner">
      <img src="https://iili.io/nHvZkQt.md.png" alt="Logo SMP" class="logo-img" onerror="this.style.display='none'">
      <div class="header-titles">
        <h1 class="brand-etam header-title">EKSKUL ETAM</h1>
        <p class="header-subtitle">Ekstrakurikuler Terpadu Absensi Murid</p>
        <p class="header-school">UPT SMP Negeri 10 Samarinda</p>
      </div>
      <img src="https://iili.io/nYaQluR.md.png" alt="Logo ETAM" class="logo-img header-logo-right" onerror="this.style.display='none'">
      <div class="header-actions">
        <button type="button" class="theme-toggle-btn" onclick="cycleTheme()" title="Ganti tema">
          <svg id="theme-icon-app" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/>
          </svg>
          <span id="theme-label-app" class="hide-mobile">Otomatis</span>
        </button>
        <div class="role-badge hide-mobile"><span id="role-badge-text">-</span></div>
        <button type="button" onclick="logout()" class="btn-icon btn-dark" title="Keluar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5M21 12H9"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <nav class="nav-bar">
    <div class="nav-inner">
      <div class="nav-tabs" id="nav-tabs"></div>
    </div>
  </nav>

  <main class="main-content" id="main-content"></main>

  <div id="toast-container" class="toast-container"></div>
</div>

<div id="modal-root"></div>
<div id="print-area"></div>

<!-- Local JS (urutan WAJIB) -->
<script src="js/config.js"></script>
<script src="js/helpers.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/routes-admin.js"></script>
<script src="js/routes-guru.js"></script>
<script src="js/routes-murid.js"></script>
<script src="js/routes-kas.js"></script>
<script src="js/routes-laporan.js"></script>
<script src="js/init.js"></script>
</body>
</html>
